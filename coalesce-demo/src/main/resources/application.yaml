spring:
  application:
    name: coalesce-demo

server:
  port: 8080

coalesce:
  redis:
    address: redis://localhost:6379
  # Results larger than this are returned to the caller but never written to Redis.
  # Redisson buffers every command in Netty's direct arena before the write, so a few
  # oversized entries in flight can exhaust MaxDirectMemorySize and kill the process.
  max-payload-bytes: 1048576

demo:
  # Caps the response size independently of the bucket range, so key cardinality can be
  # raised without inflating every payload.
  max-orders: 25

  latency:
    # Simulated downstream service time, normally distributed. Draws beyond the 95th
    # percentile (mean + 1.645 * std-dev) fail after sleeping — roughly 5% of calls.
    mean-millis: 2000
    std-dev-millis: 500
    max-millis: 8000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.web: INFO
