spring:
  application:
    name: echo
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

demo:
  latency:
    # Simulated downstream service time, normally distributed. Draws beyond the 95th
    # percentile (mean + 1.645 * std-dev) fail after sleeping — roughly 5% of calls.
    mean-millis: 300
    std-dev-millis: 80
    max-millis: 2000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.web: INFO
