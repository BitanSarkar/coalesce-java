# Publishes net.bitsar:coalesce-spring-boot-starter to Maven Central.
#
# Every merge to main publishes a permanent release. Maven Central versions are immutable:
# they cannot be deleted, replaced or reused, so each merge burns a patch number forever.
# Put [skip release] in a commit message to merge without publishing.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEY       armoured PGP private key, pasted whole, including the BEGIN/END lines
#   SIGNING_PASSWORD  its passphrase (an empty secret if the key has none)
#   CENTRAL_USERNAME  from Generate User Token at central.sonatype.com -- NOT the portal login
#   CENTRAL_PASSWORD  the token's password half

name: Release to Maven Central

on:
  push:
    branches: [main]
    # A tag still works as an explicit release of whatever gradle.properties holds; that
    # path skips the auto-bump.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publishing_type:
        description: 'AUTOMATIC releases as soon as validation passes; USER_MANAGED holds it for a manual Publish click'
        type: choice
        default: AUTOMATIC
        options: [AUTOMATIC, USER_MANAGED]

# Never cancel a release in flight, and never run two at once: concurrent runs would read
# the same version out of gradle.properties and the second would be rejected as a duplicate.
concurrency:
  group: release-to-central
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip merges explicitly marked, and skip the workflow's own version-bump commit.
    # Pushes made with GITHUB_TOKEN do not trigger workflows, so the bump cannot loop;
    # this check is a second line of defence, not the primary one.
    if: >-
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, '[skip ci]')

    permissions:
      # write: the job pushes the version bump, the tag, and the GitHub Release.
      contents: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # The bump is committed back to main, so check out the branch rather than the
          # detached commit, and keep credentials for the push.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Read project version
        id: version
        run: |
          VERSION=$(./gradlew -q properties | awk '/^version:/ {print $2}')
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      - name: Reject snapshots
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          case "$VERSION" in
            *-SNAPSHOT)
              echo "::error::Maven Central does not accept snapshots (version is $VERSION)"
              exit 1 ;;
          esac

      - name: Check the tag matches gradle.properties
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match version $VERSION in gradle.properties"
            exit 1
          fi

      # Central versions are immutable, so a duplicate upload is always rejected. Checking
      # first turns a two-minute failure into a twenty-second, clearly-explained skip --
      # which matters when this runs on every merge.
      - name: Skip if this version is already published
        id: published
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          URL="https://repo1.maven.org/maven2/net/bitsar/coalesce-spring-boot-starter/${VERSION}/coalesce-spring-boot-starter-${VERSION}.pom"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo "000")
          if [ "$CODE" = "200" ]; then
            echo "::warning::${VERSION} is already on Maven Central; nothing to publish. Was the version bump not committed?"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${VERSION} is not published yet"
          fi

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Summarise test results
        if: always()
        run: python3 .github/scripts/test-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Build the signed bundle
        if: steps.published.outputs.skip == 'false'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon :coalesce-spring-boot-starter:centralBundle

      - name: Keep the bundle as a build artifact
        if: steps.published.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle-${{ steps.version.outputs.value }}
          path: coalesce-spring-boot-starter/build/*-bundle.zip
          retention-days: 30

      - name: Upload to the Central Portal
        id: upload
        if: steps.published.outputs.skip == 'false'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          VERSION: ${{ steps.version.outputs.value }}
          PUBLISHING_TYPE: ${{ inputs.publishing_type || 'AUTOMATIC' }}
        run: |
          set -euo pipefail
          BUNDLE=$(ls coalesce-spring-boot-starter/build/*-bundle.zip)
          TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)

          DEPLOYMENT_ID=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --form "bundle=@${BUNDLE}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=net.bitsar:coalesce-spring-boot-starter:${VERSION}&publishingType=${PUBLISHING_TYPE}")

          echo "Deployment id: $DEPLOYMENT_ID"
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      # Without this the job is green the moment the bytes are accepted, which says nothing
      # about whether Central validated the signatures, the POM or the javadoc jar.
      - name: Wait for the deployment to finish
        id: wait
        if: steps.published.outputs.skip == 'false'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.id }}
          PUBLISHING_TYPE: ${{ inputs.publishing_type || 'AUTOMATIC' }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)

          for attempt in $(seq 1 90); do
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")

            STATE=$(echo "$RESPONSE" | jq -r '.deploymentState')
            echo "attempt ${attempt}: ${STATE}"

            case "$STATE" in
              PUBLISHED)
                echo "::notice::Published ${DEPLOYMENT_ID} to Maven Central"
                exit 0 ;;
              VALIDATED)
                # Only reachable under USER_MANAGED; AUTOMATIC moves straight on to
                # PUBLISHING. Nothing further will happen without a human, so stop here.
                echo "::notice::Validated, awaiting a Publish click at https://central.sonatype.com/publishing/deployments"
                exit 0 ;;
              FAILED)
                echo "::error::Central rejected the deployment"
                echo "$RESPONSE" | jq '.errors // .'
                exit 1 ;;
            esac
            sleep 10
          done

          echo "::error::Timed out after 15 minutes; check https://central.sonatype.com/publishing/deployments"
          exit 1

      # Everything below runs only after Central has accepted the artifact, so the repo
      # never records a release that did not actually publish.

      - name: Tag the release
        if: steps.published.outputs.skip == 'false' && !startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" \
            -m "Release ${VERSION}" \
            -m "Built and signed by CI run ${GITHUB_RUN_ID}; Central deployment ${DEPLOYMENT_ID}."
          git push origin "v${VERSION}"
          echo "::notice::Tagged v${VERSION}"

      - name: Create the GitHub Release
        if: steps.published.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.id }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists, leaving it alone"
            exit 0
          fi

          # Quoted heredoc so nothing here is expanded by the shell -- the notes contain
          # backticks and fenced code blocks, which an unquoted heredoc would try to run.
          cat > /tmp/release-notes.tmpl <<'NOTES'
          ```groovy
          implementation 'net.bitsar:coalesce-spring-boot-starter:__VERSION__'
          ```

          Published to Maven Central. Central deployment `__DEPLOYMENT_ID__`, built by run __RUN_ID__.

          Verify what actually landed:

          ```bash
          ./gradlew -p consumer-check test -PcoalesceVersion=__VERSION__
          ```

          __CHANGELOG__
          NOTES

          # GitHub's own --generate-notes lists merged pull requests. Work here lands
          # directly on main, so it finds none and produces a bare compare link -- which is
          # all the 0.1.2 release got. Build the changelog from the commits instead.
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            echo "Changelog from ${PREV} to ${TAG}"
            python3 .github/scripts/changelog.py --from "$PREV" --to "$TAG" > /tmp/changelog.md
          else
            echo "No earlier tag; changelog covers the whole history"
            python3 .github/scripts/changelog.py --to "$TAG" > /tmp/changelog.md
          fi

          # Not `sed -i`: its in-place flag differs between GNU and BSD, and writing to a
          # second file works identically on both, so this stays testable off the runner.
          # The changelog is substituted with `r` (read file) rather than `s`, so its own
          # backslashes and ampersands are never interpreted as replacement syntax.
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__DEPLOYMENT_ID__|${DEPLOYMENT_ID}|g" \
              -e "s|__RUN_ID__|${GITHUB_RUN_ID}|g" \
              -e "/__CHANGELOG__/{r /tmp/changelog.md" -e "d;}" \
              /tmp/release-notes.tmpl > /tmp/release-notes.md

          # A version with a suffix (0.2.0-rc1, 1.0.0-beta2) is a prerelease.
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac

          gh release create "$TAG" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            --verify-tag \
            $PRERELEASE

          echo "::notice::Created release ${TAG}"

      # Opens the next patch so the following merge has a free version to publish, and
      # points the README at what consumers can actually resolve right now.
      #
      # Pushed with GITHUB_TOKEN, whose pushes deliberately do not trigger workflows --
      # that is what stops this from releasing itself in a loop.
      - name: Open the next patch version
        if: steps.published.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          NEXT=$(echo "$VERSION" | awk -F. -v OFS=. '{ $NF = $NF + 1; print }')

          sed -e "s|^version=.*|version=${NEXT}|" gradle.properties > gradle.properties.tmp
          mv gradle.properties.tmp gradle.properties

          # README advertises the newest resolvable version, which is the one just published.
          sed -e "s|net.bitsar:coalesce-spring-boot-starter:[0-9][0-9.]*|net.bitsar:coalesce-spring-boot-starter:${VERSION}|g" \
              -e "s|<version>[0-9][0-9.]*</version>|<version>${VERSION}</version>|g" \
              README.md > README.md.tmp
          mv README.md.tmp README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties README.md
          git commit -m "Open ${NEXT} for development [skip ci]" \
            -m "${VERSION} is published and immutable, so development moves to the next patch."

          # Another merge may have landed while Central was publishing.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "::notice::Opened ${NEXT}; README now advertises ${VERSION}"
