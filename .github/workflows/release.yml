# Publishes net.bitsar:coalesce-spring-boot-starter to Maven Central.
#
# Replaces GitHub's stock "Maven Package" template, which could not work here: it ran
# `mvn -B package --file pom.xml` against a Gradle project with no pom.xml, on JDK 11
# rather than the 17 this code needs, and it targeted GitHub Packages rather than Central.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEY       armoured PGP private key, pasted whole, including the BEGIN/END lines
#   SIGNING_PASSWORD  its passphrase (set to an empty secret if the key has none)
#   CENTRAL_USERNAME  from Generate User Token at central.sonatype.com -- NOT the portal login
#   CENTRAL_PASSWORD  the token's password half

name: Release to Maven Central

# Pushing a v* tag is the release trigger. There is deliberately no
# `release: [published]` trigger: this workflow creates the GitHub Release itself, and
# having both would make that creation fire a second run which then fails against an
# already-published, immutable version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publishing_type:
        description: 'USER_MANAGED holds the upload for a manual Publish click; AUTOMATIC releases it as soon as validation passes'
        type: choice
        default: USER_MANAGED
        options: [USER_MANAGED, AUTOMATIC]
      tag_on_success:
        description: 'Create and push v<version> once Central accepts the upload'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # write: the job creates the tag and the GitHub Release once Central accepts.
      contents: write

    # The integration tests skip themselves when Redis is unreachable, which would let a
    # release go out green having proved nothing about coalescing. A service container
    # makes them actually run.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # gradle-wrapper.jar is a binary committed to the repo; this checks it against the
      # known-good Gradle releases rather than trusting whatever is in the tree.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Read project version
        id: version
        run: echo "value=$(./gradlew -q properties | awk '/^version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      # gradle.properties is the single source of truth for the version. A tag that
      # disagrees with it is always a mistake, and Central versions are immutable, so it
      # has to fail here rather than after the upload.
      - name: Check the tag matches gradle.properties
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match version $VERSION in gradle.properties"
            exit 1
          fi

      # A dispatch run has no tag to check, so instead refuse to re-release a version that
      # has already been tagged. Central versions are immutable; the upload would be
      # rejected anyway, but failing here costs 20 seconds instead of two minutes.
      - name: Refuse to re-release an already-tagged version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --silent 2>/dev/null; then
            echo "::error::v${VERSION} is already tagged. Bump the version in gradle.properties."
            exit 1
          fi
          echo "v${VERSION} is not tagged yet"

      - name: Reject snapshots
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          case "$VERSION" in
            *-SNAPSHOT)
              echo "::error::Maven Central does not accept snapshots (version is $VERSION)"
              exit 1 ;;
          esac

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Build the signed bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon :coalesce-spring-boot-starter:centralBundle

      # Kept for 30 days so a rejected deployment can be inspected without a rebuild.
      - name: Keep the bundle as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ steps.version.outputs.value }}
          path: coalesce-spring-boot-starter/build/*-bundle.zip
          retention-days: 30

      - name: Upload to the Central Portal
        id: upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          VERSION: ${{ steps.version.outputs.value }}
          # A release-triggered run holds the deployment for a manual Publish click.
          PUBLISHING_TYPE: ${{ inputs.publishing_type || 'USER_MANAGED' }}
        run: |
          set -euo pipefail
          BUNDLE=$(ls coalesce-spring-boot-starter/build/*-bundle.zip)
          TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)

          DEPLOYMENT_ID=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --form "bundle=@${BUNDLE}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=net.bitsar:coalesce-spring-boot-starter:${VERSION}&publishingType=${PUBLISHING_TYPE}")

          echo "Deployment id: $DEPLOYMENT_ID"
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      # Without this the job is green the moment the bytes are accepted, which says nothing
      # about whether Central validated the signatures, the POM or the javadoc jar.
      - name: Wait for validation
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.id }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)

          for attempt in $(seq 1 60); do
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")

            STATE=$(echo "$RESPONSE" | jq -r '.deploymentState')
            echo "attempt ${attempt}: ${STATE}"

            case "$STATE" in
              VALIDATED)
                echo "::notice::Validated. Press Publish at https://central.sonatype.com/publishing/deployments"
                exit 0 ;;
              PUBLISHED)
                echo "::notice::Published to Maven Central."
                exit 0 ;;
              FAILED)
                echo "::error::Central rejected the deployment"
                echo "$RESPONSE" | jq '.errors // .'
                exit 1 ;;
            esac
            sleep 10
          done

          echo "::error::Timed out after 10 minutes; check https://central.sonatype.com/publishing/deployments"
          exit 1

      # Only reached once Central has accepted the bundle, so a tag never points at a
      # commit that failed to publish. On a tag-triggered run the tag already exists and
      # this is skipped.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch' && inputs.tag_on_success
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" \
            -m "Release ${VERSION}" \
            -m "Built and signed by CI run ${GITHUB_RUN_ID}; Central deployment ${DEPLOYMENT_ID}."
          git push origin "v${VERSION}"
          echo "::notice::Tagged v${VERSION}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.id }}
          PUBLISHING_TYPE: ${{ inputs.publishing_type || 'USER_MANAGED' }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          # workflow_dispatch with tag_on_success=false leaves nothing to hang a release on.
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} was not created, so no GitHub Release was made"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists, leaving it alone"
            exit 0
          fi

          if [ "$PUBLISHING_TYPE" = "AUTOMATIC" ]; then
            STATUS="Published to Maven Central."
          else
            STATUS="Uploaded and validated. Awaiting the Publish click at https://central.sonatype.com/publishing/deployments"
          fi

          # Quoted heredoc so nothing here is expanded by the shell -- the notes contain
          # backticks and fenced code blocks, which an unquoted heredoc would try to run.
          # Placeholders are substituted afterwards.
          cat > /tmp/release-notes.tmpl <<'NOTES'
          ```groovy
          implementation 'net.bitsar:coalesce-spring-boot-starter:__VERSION__'
          ```

          __STATUS__

          Central deployment `__DEPLOYMENT_ID__`, built by run __RUN_ID__.

          Verify what actually landed:

          ```bash
          ./gradlew -p consumer-check test -PcoalesceVersion=__VERSION__
          ```
          NOTES

          # Not `sed -i`: its in-place flag differs between GNU and BSD, and writing to a
          # second file works identically on both, so this stays testable off the runner.
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__STATUS__|${STATUS}|g" \
              -e "s|__DEPLOYMENT_ID__|${DEPLOYMENT_ID}|g" \
              -e "s|__RUN_ID__|${GITHUB_RUN_ID}|g" \
              /tmp/release-notes.tmpl > /tmp/release-notes.md

          # A version with a suffix (0.2.0-rc1, 1.0.0-beta2) is a prerelease.
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac

          # --generate-notes appends the commit changelog under these notes.
          gh release create "$TAG" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            --verify-tag \
            $PRERELEASE

          echo "::notice::Created release ${TAG}"
