plugins {
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management' apply false
}

subprojects {
    apply plugin: 'java'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Required, not cosmetic: CoalesceKeyResolver resolves SpEL variables such as
        // "#orderId" through Spring's DefaultParameterNameDiscoverer, which since Spring 6
        // reads parameter names only from the -parameters attribute. Without this flag the
        // key expression evaluates to null.
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
