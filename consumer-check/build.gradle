plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

description = 'Post-release check: consumes the published starter from Maven Central'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

// Deliberately only Maven Central. No mavenLocal(), no project dependency.
repositories { mavenCentral() }

// Which published version to verify: ./gradlew -p consumer-check test -PcoalesceVersion=0.1.0
// Tracks the current API. 0.1.x took numeric annotation attributes and will not compile
// against this source; pass -PcoalesceVersion explicitly to check an older release.
def coalesceVersion = providers.gradleProperty('coalesceVersion').getOrElse('0.2.0')

dependencies {
    implementation "net.bitsar:coalesce-spring-boot-starter:${coalesceVersion}"
    implementation 'org.springframework.boot:spring-boot-starter'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// -parameters is deliberately NOT set here. The Spring Boot Gradle plugin adds it, and the
// README tells consumers to rely on exactly that, so this project verifies the claim:
// without the flag, "#symbol" resolves to null and differentKeysDoNotCollide fails.

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed' }
    doFirst { logger.lifecycle("Verifying net.bitsar:coalesce-spring-boot-starter:${coalesceVersion} from Maven Central") }
}

// Nothing here is an application; the check is the test task.
tasks.named('bootJar') { enabled = false }
tasks.named('jar') { enabled = true }
