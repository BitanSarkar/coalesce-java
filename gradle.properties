# Published coordinates. The published `version` is NOT set here: it comes from the git
# tag the release is cut from, so nothing has to be committed back to main afterwards. A
# merge to main publishes the next patch after the newest v* tag, and pushing a v* tag
# publishes exactly that version.
#
# The value below is a placeholder for local builds only. It is deliberately not a
# publishable version, so an accidental `centralBundle` fails instead of producing a
# bundle nobody meant to build. Pass a real one when you need it:
#   ./gradlew -Pversion=1.2.3 :coalesce-spring-boot-starter:publishToMavenLocal
group=net.bitsar
version=0.0.0-LOCAL

# Dependency versions, kept here so the starter and the demo can never drift apart.
springBootVersion=3.5.16
springDependencyManagementVersion=1.1.7
redissonVersion=3.52.0
springdocVersion=2.9.0

org.gradle.parallel=true
org.gradle.caching=true
