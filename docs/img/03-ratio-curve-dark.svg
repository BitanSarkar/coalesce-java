<text class="tick" x="118.8" y="320" text-anchor="middle">0.001</text>
<line class="grid" x1="232.8" y1="70" x2="232.8" y2="300"/>
<text class="tick" x="232.8" y="320" text-anchor="middle">0.01</text>
