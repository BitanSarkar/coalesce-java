<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" role="img" aria-label="Saving against ratio, with three measured runs">
<title>Saving against ratio, with three measured runs</title>
<desc>The saving curve rises steeply once the ratio passes about 2. Ten keys at ratio 28.4 saved 96.48 percent, ninety-five keys at ratio 1.10 saved 8.78 percent, and one million keys at ratio 0.002 saved 0.25 percent.</desc>
<rect width="880" height="368" fill="#0d1117"/>
<style>.bx{fill:#161b22;stroke:#30363d;stroke-width:1.5}.cap{fill:#8b949e;font:600 12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}.lbl{fill:#e6edf3;font:12px ui-sans-serif,system-ui,sans-serif}.mn{fill:#e6edf3;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.mut{fill:#8b949e;font:12px ui-sans-serif,system-ui,sans-serif}.tick{fill:#8b949e;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.grid{stroke:#30363d;stroke-width:1;opacity:.5;stroke-dasharray:3 4}</style>
<text class="cap" x="14" y="24">saving vs ratio, with the three measured runs</text>
<text class="lbl" x="14" y="46">ratio = requests per second per key x (freshTtl + downstream latency)</text>
