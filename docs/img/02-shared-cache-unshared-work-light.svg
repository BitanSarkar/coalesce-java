<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" role="img" aria-label="The cache is shared but the in-flight state is not">
<title>The cache is shared but the in-flight state is not</title>
<desc>Four pods each hold their own lock, so coalescing happens per JVM, while all four write the identical computed value into one shared Redis cache.</desc>
<rect width="880" height="268" fill="#ffffff"/>
<style>.bx{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}.cap{fill:#57606a;font:600 12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}.lbl{fill:#1f2328;font:12px ui-sans-serif,system-ui,sans-serif}.mn{fill:#1f2328;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.mut{fill:#57606a;font:12px ui-sans-serif,system-ui,sans-serif}.tick{fill:#57606a;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.grid{stroke:#d0d7de;stroke-width:1;opacity:.5;stroke-dasharray:3 4}</style>
<text class="cap" x="14" y="24">what a redis-backed cache actually shares</text>
<rect class="bx" x="16" y="52" width="116" height="74" rx="8"/>
<text class="mn" x="30" y="76">pod 1</text>
<rect x="30" y="86" width="88" height="26" rx="4" fill="#9a6700" opacity=".22"/>
<text x="36" y="104" fill="#9a6700" font-family="ui-monospace,monospace" font-size="12">own lock</text>
<line stroke="#0969da" stroke-width="1.6" x1="74" y1="126" x2="74" y2="168"/>
<rect class="bx" x="148" y="52" width="116" height="74" rx="8"/>
<text class="mn" x="162" y="76">pod 2</text>
<rect x="162" y="86" width="88" height="26" rx="4" fill="#9a6700" opacity=".22"/>
<text x="168" y="104" fill="#9a6700" font-family="ui-monospace,monospace" font-size="12">own lock</text>
<line stroke="#0969da" stroke-width="1.6" x1="206" y1="126" x2="206" y2="168"/>
<rect class="bx" x="280" y="52" width="116" height="74" rx="8"/>
<text class="mn" x="294" y="76">pod 3</text>
<rect x="294" y="86" width="88" height="26" rx="4" fill="#9a6700" opacity=".22"/>
<text x="300" y="104" fill="#9a6700" font-family="ui-monospace,monospace" font-size="12">own lock</text>
<line stroke="#0969da" stroke-width="1.6" x1="338" y1="126" x2="338" y2="168"/>
<rect class="bx" x="412" y="52" width="116" height="74" rx="8"/>
<text class="mn" x="426" y="76">pod 4</text>
<rect x="426" y="86" width="88" height="26" rx="4" fill="#9a6700" opacity=".22"/>
<text x="432" y="104" fill="#9a6700" font-family="ui-monospace,monospace" font-size="12">own lock</text>
<line stroke="#0969da" stroke-width="1.6" x1="470" y1="126" x2="470" y2="168"/>
<text x="556" y="94" fill="#9a6700" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">in-flight state is</text>
<text x="556" y="112" fill="#9a6700" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">per JVM. Not shared.</text>
<rect class="bx" x="16" y="168" width="512" height="52" rx="8"/>
<text class="mn" x="40" y="190">one Redis</text>
<text class="mut" x="40" y="210">the cache is shared, and every pod writes the identical value into it</text>
<text x="556" y="192" fill="#0969da" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">the cache IS shared.</text>
<text class="lbl" x="14" y="252">The cache is distributed. The single-flight is not. That one sentence is the whole gap.</text>
</svg>
