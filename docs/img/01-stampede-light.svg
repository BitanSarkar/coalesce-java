<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="Twelve pods miss the same cold key and all call the dependency at once">
<title>Twelve pods miss the same cold key and all call the dependency at once</title>
<desc>Twelve pods each miss the same cache key within a few hundred milliseconds and each calls the same slow dependency, producing twelve identical calls of which eleven are waste.</desc>
<rect width="880" height="190" fill="#ffffff"/>
<style>.bx{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}.cap{fill:#57606a;font:600 12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}.lbl{fill:#1f2328;font:12px ui-sans-serif,system-ui,sans-serif}.mn{fill:#1f2328;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.mut{fill:#57606a;font:12px ui-sans-serif,system-ui,sans-serif}.tick{fill:#57606a;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.grid{stroke:#d0d7de;stroke-width:1;opacity:.5;stroke-dasharray:3 4}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/></marker>
</defs>
<text class="cap" x="14" y="24">one key goes cold. twelve pods notice at once.</text>
<rect class="bx" x="16" y="56" width="62" height="32" rx="6"/>
<text class="mn" x="29" y="77">pod 1</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M78 72 C 540 72, 560 118, 612 118"/>
<rect class="bx" x="90" y="56" width="62" height="32" rx="6"/>
<text class="mn" x="103" y="77">pod 2</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M152 72 C 540 72, 560 118, 612 118"/>
<rect class="bx" x="164" y="56" width="62" height="32" rx="6"/>
<text class="mn" x="177" y="77">pod 3</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M226 72 C 540 72, 560 118, 612 118"/>
<rect class="bx" x="238" y="56" width="62" height="32" rx="6"/>
<text class="mn" x="251" y="77">pod 4</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M300 72 C 540 72, 560 118, 612 118"/>
<rect class="bx" x="312" y="56" width="62" height="32" rx="6"/>
<text class="mn" x="325" y="77">pod 5</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M374 72 C 540 72, 560 118, 612 118"/>
<rect class="bx" x="386" y="56" width="62" height="32" rx="6"/>
<text class="mn" x="399" y="77">pod 6</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M448 72 C 540 72, 560 118, 612 118"/>
<rect class="bx" x="16" y="102" width="62" height="32" rx="6"/>
<text class="mn" x="29" y="123">pod 7</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M78 118 C 540 118, 560 118, 612 118"/>
<rect class="bx" x="90" y="102" width="62" height="32" rx="6"/>
<text class="mn" x="103" y="123">pod 8</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M152 118 C 540 118, 560 118, 612 118"/>
<rect class="bx" x="164" y="102" width="62" height="32" rx="6"/>
<text class="mn" x="177" y="123">pod 9</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M226 118 C 540 118, 560 118, 612 118"/>
<rect class="bx" x="238" y="102" width="62" height="32" rx="6"/>
<text class="mn" x="251" y="123">pod 10</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M300 118 C 540 118, 560 118, 612 118"/>
<rect class="bx" x="312" y="102" width="62" height="32" rx="6"/>
<text class="mn" x="325" y="123">pod 11</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M374 118 C 540 118, 560 118, 612 118"/>
<rect class="bx" x="386" y="102" width="62" height="32" rx="6"/>
<text class="mn" x="399" y="123">pod 12</text>
<path stroke="#9a6700" fill="none" stroke-width="1.3" opacity=".7" d="M448 118 C 540 118, 560 118, 612 118"/>
<rect class="bx" x="616" y="78" width="248" height="80" rx="10"/>
<text class="lbl" x="636" y="108">the slow dependency</text>
<text class="mut" x="636" y="130">the reason you added a cache</text>
<text x="636" y="150" fill="#9a6700" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">12 identical calls. 11 are waste.</text>
<text class="mut" x="16" y="172">Autoscaling makes it worse: every pod added under load is one more caller in the next stampede.</text>
</svg>
